<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="container">

    <!-- Profile Section -->
    <section class="profile">
      <img class="profile-img" src="{{ site.profile_image | default: '/assets/profile.jpeg' }}" alt="Profile picture">

      <div class="profile-text">
        <h1>{{ site.title }}</h1>

        <p>{{ site.description }}</p>

        <div class="social-links">
          {% for link in site.minima.social_links %}
            <a href="{{ link.url }}" target="_blank"><img src="/assets/icons/{{ link.icon }}.svg" alt="{{ link.title }}"></a>
          {% endfor %}
        </div>
      </div>
    </section>

    <!-- Page Content -->
    {{ content }}

    <footer>
      © {{ site.time | date: "%Y" }} {{ site.title }}
    </footer>

  </div>
</body>
</html>
